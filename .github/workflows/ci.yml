name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm
      - name: Install web dependencies
        run: npm ci
      - name: Install Cloud Functions dependencies
        run: npm install --prefix functions --no-audit --no-fund
      - name: Type-check frontend
        run: npm run typecheck
      - name: Build production frontend
        run: npm run build
      - name: Check Cloud Functions syntax
        run: npm run check:functions
      - name: Test Cloud Functions domain logic
        run: npm run test:functions
