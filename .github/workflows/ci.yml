name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm
      - name: Install web dependencies
        run: npm ci
      - name: Report npm dependency advisories
        shell: bash
        run: |
          npm audit --json > /tmp/kudapkita-audit.json || true
          node -e "const r=require('/tmp/kudapkita-audit.json'); const v=Object.entries(r.vulnerabilities||{}); console.log('Full dependency audit:', JSON.stringify(v.map(([name,item])=>({name,severity:item.severity,range:item.range,fixAvailable:item.fixAvailable,nodes:item.nodes,via:item.via?.map(v=>typeof v==='string'?v:{title:v.title,url:v.url,cwe:v.cwe,range:v.range})})),null,2)); console.log('Counts:', JSON.stringify(r.metadata?.vulnerabilities||{})); console.log('Advisories:', JSON.stringify(r.advisories||{},null,2));"
          npm audit --omit=dev --json > /tmp/kudapkita-production-audit.json || true
          node -e "const r=require('/tmp/kudapkita-production-audit.json'); const v=Object.entries(r.vulnerabilities||{}); console.log('Production dependency audit:', JSON.stringify(v.map(([name,item])=>({name,severity:item.severity,range:item.range,fixAvailable:item.fixAvailable})),null,2)); console.log('Counts:', JSON.stringify(r.metadata?.vulnerabilities||{}));"
      - name: Install Cloud Functions dependencies
        run: npm install --prefix functions --no-audit --no-fund
      - name: Type-check frontend
        run: npm run typecheck
      - name: Build production frontend
        run: npm run build
      - name: Check Cloud Functions syntax
        run: npm run check:functions
      - name: Test Cloud Functions domain logic
        run: npm run test:functions
      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test Firestore security rules in emulator
        run: npx --yes firebase-tools@latest emulators:exec --only firestore --project demo-kudapkita-rules "npm run test:rules --prefix functions"
