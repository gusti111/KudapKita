name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Report dependency audit summary
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const r=require('./npm-audit.json'); console.log('Dependency audit:', JSON.stringify(r.metadata?.vulnerabilities ?? {})); for (const [name,v] of Object.entries(r.vulnerabilities ?? {})) console.log(name + ' | ' + v.severity + ' | direct=' + v.isDirect + ' | range=' + v.range + ' | fix=' + JSON.stringify(v.fixAvailable));"
      - run: npm run typecheck
      - run: npm run build

  functions-and-rules:
    name: Callable domain tests and Firestore Rules Emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Functions dependencies
        run: npm install --prefix functions
      - name: Check Functions source
        run: npm --prefix functions run check
      - name: Report Functions dependency audit summary
        run: |
          npm audit --prefix functions --json > functions-audit.json || true
          node -e "const r=require('./functions-audit.json'); console.log('Functions dependency audit:', JSON.stringify(r.metadata?.vulnerabilities ?? {})); for (const [name,v] of Object.entries(r.vulnerabilities ?? {})) console.log(name + ' | ' + v.severity + ' | direct=' + v.isDirect + ' | range=' + v.range + ' | fix=' + JSON.stringify(v.fixAvailable));"
      - name: Run callable domain tests
        run: npm --prefix functions test
      - name: Run Firestore Rules Emulator tests
        run: npx --yes firebase-tools emulators:exec --only firestore --project demo-kudapkita "npm --prefix functions run test:rules"

  source-zip:
    name: Package source ZIP
    needs: [frontend, functions-and-rules]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate a fresh Functions lockfile for the source bundle
        run: npm install --package-lock-only --ignore-scripts --prefix functions
      - name: Create clean source archive
        run: |
          mkdir -p /tmp/kudapkita-package
          git archive --format=tar HEAD | tar -xf - -C /tmp/kudapkita-package
          cp functions/package-lock.json /tmp/kudapkita-package/functions/package-lock.json
          cd /tmp
          zip -qr KudapKita-source.zip kudapkita-package
          mv KudapKita-source.zip "$GITHUB_WORKSPACE/KudapKita-source.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: KudapKita-source-${{ github.sha }}
          path: KudapKita-source.zip
          if-no-files-found: error
          retention-days: 30
